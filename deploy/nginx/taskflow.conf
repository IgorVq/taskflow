# Proxy de la prod : HTTP redirigé vers HTTPS, HTTPS relayé vers le front.
server_tokens off;

server {
    listen 80;
    server_name taskflow.localhost localhost;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name taskflow.localhost localhost;

    ssl_certificate     /etc/nginx/certs/taskflow.crt;
    ssl_certificate_key /etc/nginx/certs/taskflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:5m;

    # Pas de HSTS : sur localhost il s'appliquerait aussi au dev (8080).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /metrics {
        return 404;
    }

    # IP de « front » résolue au démarrage : deploy.sh fait un reload après chaque déploiement.
    location / {
        proxy_pass http://front:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
