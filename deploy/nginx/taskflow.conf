# ============================================================================
# Nginx du service « proxy » (prod) : unique porte d'entrée de TaskFlow.
# Monté en lecture seule sur /etc/nginx/conf.d/default.conf par compose.prod.yaml.
#
# Après une modification, TOUJOURS tester avant de recharger :
#     docker compose -f compose.prod.yaml exec proxy nginx -t
#     docker compose -f compose.prod.yaml exec proxy nginx -s reload
# ============================================================================

# Ne pas annoncer la version de Nginx dans les en-têtes et les pages d'erreur.
server_tokens off;

# ---------- HTTP (80) : rien n'est servi en clair, tout part vers HTTPS --------
server {
    listen 80;
    server_name taskflow.localhost localhost;

    # Sonde du healthcheck Docker : la seule URL qui répond en HTTP.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 301 = redirection permanente. Limite du lab : si HTTPS_PORT=8443, la
    # redirection vise quand même 443 ; ouvrez alors https://taskflow.localhost:8443.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (443) : le site -------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name taskflow.localhost localhost;

    ssl_certificate     /etc/nginx/certs/taskflow.crt;
    ssl_certificate_key /etc/nginx/certs/taskflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:5m;

    # En-têtes de sécurité de base. Pas de HSTS volontairement : sur « localhost »
    # il forcerait le navigateur en HTTPS pour TOUS les ports, y compris le dev en 8080.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Les métriques de l'API sont pour le monitoring interne (réseau taskflow-prod),
    # pas pour Internet. Le front ne relaie déjà que /api/ et /health ; on le dit
    # explicitement ici (défense en profondeur).
    location = /metrics {
        return 404;
    }

    # « front » = nom du service Compose. Nginx traduit ce nom en IP AU DÉMARRAGE
    # (et à chaque reload) seulement : quand le front est recréé par un déploiement,
    # son IP peut changer. D'où le `nginx -s reload` à la fin de deploy.sh.
    location / {
        proxy_pass http://front:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
