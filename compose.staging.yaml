# Staging : mêmes images que la prod, sans proxy ni TLS, front sur le port 8081.
name: taskflow-staging

x-durcissement: &durcissement
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-sonde: &sonde
  interval: 10s
  timeout: 3s
  retries: 5

# Noms fixes : repris par OpenTofu au Jour 4.
services:
  db:
    <<: *durcissement
    image: docker.io/library/postgres:16-alpine
    container_name: taskflow-staging-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_DB: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]

  api:
    <<: *durcissement
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER absent du .env}/taskflow-api:${IMAGE_TAG:-tag-non-defini}
    platform: linux/amd64
    container_name: taskflow-staging-api
    environment:
      PORT: "3000"
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}@db:5432/taskflow
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      start_period: 15s

  front:
    <<: *durcissement
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER absent du .env}/taskflow-front:${IMAGE_TAG:-tag-non-defini}
    platform: linux/amd64
    container_name: taskflow-staging-front
    ports:
      - "${FRONT_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]

volumes:
  pgdata:
    name: taskflow-staging-pgdata

networks:
  default:
    name: taskflow-staging
