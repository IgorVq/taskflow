# ============================================================================
# compose.staging.yaml : environnement de STAGING (pré-production) de TaskFlow
#
# Il vit dans STAGING_DIR (~/taskflow-staging), avec son propre .env (mot de passe
# DIFFÉRENT de la prod). Il lance EXACTEMENT les mêmes images que la prod (même
# IMAGE_TAG), juste avant elle : une release cassée doit mourir ici.
#
# Différences de STRUCTURE avec compose.prod.yaml (pas seulement des valeurs) :
#   1. pas de service proxy, donc pas de HTTPS ni de certificats ;
#   2. le front publie lui-même son port (http://localhost:8081) ;
#   3. noms de conteneurs, de volume et de réseau fixés à la main.
#
#     COMPOSE_FILE=compose.staging.yaml ./deploy.sh <sha>
# ============================================================================

name: taskflow-staging

x-durcissement: &durcissement
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-sonde: &sonde
  interval: 10s
  timeout: 3s
  retries: 5

# Noms FIXES (container_name, volume et réseau) : ils ne dépendent plus du nom du
# projet ni du numéro de réplique. Au Jour 4, OpenTofu décrit ce même environnement
# et doit retrouver exactement ces noms ; les scripts et la doc peuvent aussi viser
# « taskflow-staging-api » sans deviner un suffixe -1.

services:
  db:
    <<: *durcissement
    image: docker.io/library/postgres:16-alpine
    container_name: taskflow-staging-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_DB: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]

  api:
    <<: *durcissement
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER absent du .env}/taskflow-api:${IMAGE_TAG:-tag-non-defini}
    container_name: taskflow-staging-api
    environment:
      PORT: "3000"
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}@db:5432/taskflow
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      start_period: 15s

  front:
    <<: *durcissement
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER absent du .env}/taskflow-front:${IMAGE_TAG:-tag-non-defini}
    container_name: taskflow-staging-front
    # Pas de proxy en staging : le front (son Nginx relaie déjà /api et /health) est publié.
    ports:
      - "${FRONT_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]

volumes:
  pgdata:
    name: taskflow-staging-pgdata

networks:
  default:
    name: taskflow-staging
