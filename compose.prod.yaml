# Production : lancé dans ~/taskflow-prod par deploy.sh (IMAGE_TAG = SHA court).
name: taskflow-prod

x-durcissement: &durcissement
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-sonde: &sonde
  interval: 10s
  timeout: 3s
  retries: 5

services:
  db:
    <<: *durcissement
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_DB: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    <<: *durcissement
    # Tag par défaut invalide : un `up` sans IMAGE_TAG échoue au lieu de prendre latest.
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER absent du .env}/taskflow-api:${IMAGE_TAG:-tag-non-defini}
    platform: linux/amd64
    # Toute la configuration vient du .env (DATABASE_URL, APP_ENV...).
    env_file:
      - .env
    environment:
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m

  front:
    <<: *durcissement
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER absent du .env}/taskflow-front:${IMAGE_TAG:-tag-non-defini}
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
    deploy:
      resources:
        limits:
          memory: 128m

  proxy:
    <<: *durcissement
    image: docker.io/library/nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/taskflow.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      front:
        condition: service_healthy
    healthcheck:
      <<: *sonde
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:

# Nom fixe : rejoint par la stack de monitoring (external).
networks:
  default:
    name: taskflow-prod
